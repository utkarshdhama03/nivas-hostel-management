# Alembic configuration. The database URL is NOT here (it would contain a
# password): migrations/env.py builds it from environment variables and always
# connects as hms_owner, the only role allowed to change the schema.
#
#   alembic upgrade head                 # the dev database "hms"
#   alembic -x db=hms_test upgrade head  # another database (the tests do this)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
