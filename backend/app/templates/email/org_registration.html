{% extends "base.html" %}
{% block content %}
<h1 style="font-size:18px;margin:0 0 12px">Confirm your organization</h1>
<p>Hello {{ name }},</p>
<p>Confirm that you registered <strong>{{ org_name }}</strong>.</p>
<p style="margin:20px 0"><a href="{{ link_url }}" style="background:#1d4ed8;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none">Confirm organization</a></p>
<p style="font-size:13px;color:#6b7280">The link works once and expires in {{ hours }} hours. If you didn't register, ignore this email.</p>
{% endblock %}
