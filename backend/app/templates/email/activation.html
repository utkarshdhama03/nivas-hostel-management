{% extends "base.html" %}
{% block content %}
<h1 style="font-size:18px;margin:0 0 12px">Activate your account</h1>
<p>Hello {{ name }},</p>
<p>An account was created for you at <strong>{{ org_name }}</strong>.</p>
<p style="margin:20px 0"><a href="{{ link_url }}" style="background:#1d4ed8;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none">Set your password</a></p>
<p style="font-size:13px;color:#6b7280">The link works once and expires in {{ days }} days.</p>
{% endblock %}
